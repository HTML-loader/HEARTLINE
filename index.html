<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121d"><title>Heartline</title><style>
:root{--bg:#100d14;--panel:#1b1621;--border:#342b3d;--text:#f7f2fa;--muted:#aaa0b1;--green:#58d68d;--red:#ef6262;--pink:#f28ab6;--accent:#c99af5}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,#c99af51f,transparent 32%),radial-gradient(circle at 90% 20%,#f28ab614,transparent 30%),var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 50px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.brand h1{margin:0;font-size:42px;letter-spacing:-1.5px}.brand p{margin:5px 0 0;color:var(--muted)}.add{border:0;border-radius:14px;padding:13px 18px;font-weight:800;color:#18121d;background:linear-gradient(135deg,#e4c8fa,#f4b5d2)}.empty{text-align:center;padding:70px 20px;border:1px dashed var(--border);border-radius:24px;background:#1b1621a6}.heart{font-size:46px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(180deg,#211a28,#1b1621);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:0 18px 50px #00000047}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.person{display:flex;align-items:center;gap:13px;min-width:0}.avatar{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#3a2c48,#29202f);color:#f3dfff;font-weight:900;flex:none}.person h2{font-size:19px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rel{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:7px}.icon{border:1px solid var(--border);background:#19141f;color:#d8cedd;width:36px;height:36px;border-radius:11px}.section{margin-top:20px}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:#c9bdcc;font-weight:800}.value{font-size:12px;color:var(--muted)}.friend{height:13px;border-radius:99px;position:relative;background:linear-gradient(90deg,var(--green),#b8b45d 50%,var(--red))}.cover{position:absolute;inset:0 0 0 auto;background:#100d14d9}.dot{position:absolute;top:50%;width:21px;height:21px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid white;background:var(--green);box-shadow:0 2px 10px #0006}.crush{height:13px;border-radius:99px;background:linear-gradient(90deg,#312834,#f8c4da);overflow:hidden}.crushfill{height:100%;background:linear-gradient(90deg,#e970a7,var(--pink));border-radius:99px}.notes{color:#d8d0da;font-size:14px;line-height:1.5;background:#17121c;border:1px solid #2c2433;border-radius:13px;padding:12px;min-height:46px;white-space:pre-wrap}.none{color:#817686;font-style:italic}.entries{margin-top:16px;padding:11px 13px;border-radius:12px;border:1px dashed #302737;color:#817686;font-size:13px}dialog{border:1px solid var(--border);border-radius:24px;background:#1b1621;color:var(--text);width:min(560px,calc(100% - 28px));padding:0;box-shadow:0 30px 90px #0000008c}dialog::backdrop{background:#000000ad;backdrop-filter:blur(5px)}.modal{padding:24px}.modal h2{margin:0 0 5px;font-size:24px}.sub{margin:0 0 22px;color:var(--muted);font-size:14px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:#d8cedd}input[type=text],textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:#120f16;color:var(--text);padding:12px;outline:none}textarea{min-height:100px;resize:vertical}.editor{padding:14px;border:1px solid #2e2535;border-radius:15px;background:#17121d}.editor+.editor{margin-top:10px}.barhead{display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px;font-weight:800}input[type=range]{width:100%;accent-color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.cancel{background:#27202e;color:#ddd;border:1px solid var(--border);padding:11px 16px;border-radius:12px}.save{background:linear-gradient(135deg,#d8b5f5,#f0afd0);color:#19121e;border:0;padding:11px 17px;border-radius:12px;font-weight:900}
.card.compact{cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.card.compact:hover{transform:translateY(-3px);border-color:#665174;box-shadow:0 20px 55px #00000055}
.tap-hint{margin-top:17px;color:#776b7d;font-size:12px;text-align:right}
.profile-head{display:flex;align-items:center;gap:14px;padding-bottom:4px}
.avatar.big{width:64px;height:64px;border-radius:19px;font-size:23px}
.profile-name{font-size:24px;font-weight:850}
.profile-entries{margin-top:20px;border:1px dashed #3a3042;border-radius:15px;padding:15px}
.empty-entries{color:#817686;font-size:14px;margin-top:7px}
@media(max-width:720px){.app{width:min(100% - 18px,600px);padding-top:18px}.brand h1{font-size:34px}.brand p{font-size:13px}.add{padding:11px 13px}.grid{grid-template-columns:1fr}.card{padding:17px}}
</style></head><body><div class="app"><header><div class="brand"><h1>Heartline 💗</h1><p>Your people, mapped by connection.</p></div><button class="add" id="add">＋ Add person</button></header><main id="area"></main></div>
<dialog id="profileDlg">
  <div class="modal">
    <h2 id="profileTitle">Profile</h2>
    <p class="sub">Heartline profile</p>
    <div id="profileBody"></div>
  </div>
</dialog>
<dialog id="dlg"><form class="modal" id="form"><h2 id="title">Add person</h2><p class="sub">Build their little Heartline profile.</p><div class="field"><label>Name</label><input id="name" type="text" maxlength="80" placeholder="Their name" required></div><div class="field"><label>Relationship</label><input id="rel" type="text" maxlength="80" placeholder="Friend, sibling, classmate..." required></div><div class="field"><div class="editor"><div class="barhead"><span>Friendship / Enemy-ship</span><span id="fv">50%</span></div><input id="fr" type="range" min="0" max="100" value="50"></div><div class="editor"><div class="barhead"><span>Romantic interest</span><span id="cv">0%</span></div><input id="cr" type="range" min="0" max="100" value="0"></div></div><div class="field"><label>Notes</label><textarea id="notes" maxlength="4000" placeholder="Anything you want to remember about them..."></textarea></div><div class="modal-actions"><button type="button" class="cancel" id="cancel">Cancel</button><button class="save">Save person</button></div></form></dialog>
<script>
const KEY="heartline-people-v1";let people=[],editing=null;
const $=x=>document.getElementById(x),dlg=$("dlg");
function load(){try{people=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){people=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function initials(s){return s.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"}
function ftxt(v){return v<=15?"Strong enemy":v<=35?"Enemy-leaning":v<65?"Neutral":v<85?"Friend-leaning":"Strong friend"}
function ctxt(v){return v===0?"None":v<30?"A little":v<70?"Some":v<90?"Strong":"Major crush"}
function render(){
  let a=$("area");
  if(!people.length){
    a.innerHTML='<div class="empty"><div class="heart">💗</div><h2>No people yet</h2><p style="color:var(--muted)">Add someone to start building your Heartline.</p></div>';
    return;
  }
  a.innerHTML='<div class="grid">'+people.map(p=>{
    let f=Math.max(0,Math.min(100,+p.friend||0)), c=Math.max(0,Math.min(100,+p.crush||0));
    return `<article class="card compact" onclick="openProfile('${p.id}')">
      <div class="top">
        <div class="person">
          <div class="avatar">${initials(p.name)}</div>
          <div><h2>${esc(p.name)}</h2><div class="rel">${esc(p.relationship)}</div></div>
        </div>
        <div class="actions" onclick="event.stopPropagation()">
          <button class="icon" onclick="editPerson('${p.id}')">✎</button>
          <button class="icon" onclick="delPerson('${p.id}')">×</button>
        </div>
      </div>
      <div class="section">
        <div class="row"><span class="label">Friendship / Enemy-ship</span><span class="value">${ftxt(f)}</span></div>
        <div class="friend"><div class="cover" style="width:${100-f}%"></div><div class="dot" style="left:${f}%"></div></div>
      </div>
      ${c>0?`<div class="section"><div class="row"><span class="label">Romantic interest</span><span class="value">${ctxt(c)}</span></div><div class="crush"><div class="crushfill" style="width:${c}%"></div></div></div>`:""}
      <div class="tap-hint">Tap to open profile →</div>
    </article>`;
  }).join("")+'</div>';
}

function openProfile(id){
  let p=people.find(x=>x.id===id);
  if(!p)return;
  let f=Math.max(0,Math.min(100,+p.friend||0)), c=Math.max(0,Math.min(100,+p.crush||0));
  $("profileTitle").textContent=p.name;
  $("profileBody").innerHTML=`
    <div class="profile-head">
      <div class="avatar big">${initials(p.name)}</div>
      <div><div class="profile-name">${esc(p.name)}</div><div class="rel">${esc(p.relationship)}</div></div>
    </div>
    <div class="section">
      <div class="row"><span class="label">Friendship / Enemy-ship</span><span class="value">${ftxt(f)} · ${f}%</span></div>
      <div class="friend"><div class="cover" style="width:${100-f}%"></div><div class="dot" style="left:${f}%"></div></div>
    </div>
    ${c>0?`<div class="section"><div class="row"><span class="label">Romantic interest</span><span class="value">${ctxt(c)} · ${c}%</span></div><div class="crush"><div class="crushfill" style="width:${c}%"></div></div></div>`:""}
    <div class="section"><div class="row"><span class="label">Notes</span></div><div class="notes ${p.notes?"":"none"}">${p.notes?esc(p.notes):"No notes yet."}</div></div>
    <div class="profile-entries"><div class="label">Entries in…</div><div class="empty-entries">Nothing here yet.</div></div>
    <div class="modal-actions"><button class="cancel" onclick="profileDlg.close()">Close</button><button class="save" onclick="profileDlg.close();editPerson('${p.id}')">Edit profile</button></div>`;
  profileDlg.showModal();
}
function openAdd(){editing=null;$("title").textContent="Add person";$("name").value="";$("rel").value="";$("fr").value=50;$("cr").value=0;$("notes").value="";labels();dlg.showModal();setTimeout(()=>$("name").focus(),50)}
function editPerson(id){let p=people.find(x=>x.id===id);if(!p)return;editing=id;$("title").textContent="Edit person";$("name").value=p.name;$("rel").value=p.relationship;$("fr").value=p.friend;$("cr").value=p.crush;$("notes").value=p.notes||"";labels();dlg.showModal()}
function delPerson(id){let p=people.find(x=>x.id===id);if(p&&confirm("Delete "+p.name+" from Heartline?")){people=people.filter(x=>x.id!==id);save();render()}}
function labels(){$("fv").textContent=$("fr").value+"%";$("cv").textContent=$("cr").value+"%"}
$("add").onclick=openAdd;$("cancel").onclick=()=>dlg.close();$("fr").oninput=labels;$("cr").oninput=labels;
$("form").onsubmit=e=>{e.preventDefault();let d={name:$("name").value.trim(),relationship:$("rel").value.trim(),friend:+$("fr").value,crush:+$("cr").value,notes:$("notes").value.trim()};if(!d.name||!d.relationship)return;if(editing){let i=people.findIndex(x=>x.id===editing);if(i>-1)people[i]={...people[i],...d}}else people.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),...d});save();render();dlg.close()};dlg.onclick=e=>{if(e.target===dlg)dlg.close()};load();render();
</script></body></html>
